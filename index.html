<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivias de repaso</title>
<style>
  :root{--navy:#0e2740;--navy2:#143655;--gold:#e0b13a;--teal:#2a9d8f;--cream:#f6efe0;--cream-dim:#d9d0bd;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--cream);
    background:radial-gradient(1200px 600px at 80% -10%, rgba(42,157,143,.18), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(224,177,58,.14), transparent 55%),
      linear-gradient(160deg,var(--navy) 0%, var(--navy2) 100%)}
  main{max-width:820px;margin:0 auto;padding:8vh 20px 60px}
  .sub{color:var(--gold);font-size:13px;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif}
  h1{font-family:Georgia,serif;font-size:clamp(28px,4vw,40px);margin:6px 0 26px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  a.card{display:block;text-decoration:none;color:var(--cream);background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);border-top:6px solid var(--teal);border-radius:14px;padding:20px 22px;
    transition:background .15s,transform .15s}
  a.card:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
  a.card .k{display:block;color:var(--gold);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  a.card b{display:block;font-family:Georgia,serif;font-size:22px;margin:8px 0 6px}
  a.card span.d{color:var(--cream-dim);font-size:14px;line-height:1.45}
</style>
</head>
<body>
<main>
  <div class="sub">Repaso del semestre</div>
  <h1>Trivias de repaso</h1>
  <div class="cards">
    <a class="card" href="lab.html"><span class="k">Laboratorio de Investigación</span><b>Trivia del semestre</b><span class="d">Del enfoque cualitativo a la ética: seis temas, cinco preguntas cada uno.</span></a>
    <a class="card" href="ch2.html" style="border-top-color:#e0b13a"><span class="k">Conciencia Histórica II</span><b>Trivia del semestre</b><span class="d">De la Revolución francesa a la Revolución Rusa: seis temas, cinco preguntas cada uno.</span></a>
  </div>
</main>
</body>
</html>
